<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7a5c3e"/></marker>
  <marker id="arrw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8e2f2a"/></marker>
  <marker id="arrt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2f5d62"/></marker>
</defs>
<rect width="1200" height="600" fill="#f7efdf"/>
<rect x="8" y="8" width="1184" height="584" fill="none" stroke="#c9b28c" stroke-width="1.5" rx="6"/>
<text x="600.0" y="52" text-anchor="middle" font-family="Lora" font-weight="700" font-size="26" fill="#3a2a1c">Copier une carte</text><text x="600.0" y="80" text-anchor="middle" font-family="Inter" font-weight="400" font-size="15" fill="#8a7560" font-style="italic">Le copiste paie le papier : une page vierge de son carnet</text><rect x="60" y="110" width="280" height="54" rx="10" fill="#fffaf0" stroke="#2f5d62" stroke-width="2"/><text x="200" y="144" text-anchor="middle" font-family="Lora" font-weight="700" font-size="18" fill="#3a2a1c">Joueur A (copiste)</text><line x1="200" y1="164" x2="200" y2="560" stroke="#c9b28c" stroke-width="2" stroke-dasharray="4 6"/><rect x="460" y="110" width="280" height="54" rx="10" fill="#fffaf0" stroke="#3a2a1c" stroke-width="2"/><text x="600" y="144" text-anchor="middle" font-family="Lora" font-weight="700" font-size="18" fill="#3a2a1c">Portolan</text><line x1="600" y1="164" x2="600" y2="560" stroke="#c9b28c" stroke-width="2" stroke-dasharray="4 6"/><rect x="860" y="110" width="280" height="54" rx="10" fill="#fffaf0" stroke="#7a5c3e" stroke-width="2"/><text x="1000" y="144" text-anchor="middle" font-family="Lora" font-weight="700" font-size="18" fill="#3a2a1c">Joueur B</text><line x1="1000" y1="164" x2="1000" y2="560" stroke="#c9b28c" stroke-width="2" stroke-dasharray="4 6"/><line x1="200" y1="205" x2="594" y2="205" stroke="#2f5d62" stroke-width="2.2" marker-end="url(#arrt)"/><text x="400.0" y="195" text-anchor="middle" font-family="Inter" font-weight="600" font-size="15" fill="#2f5d62">1. « Copier » sur une page dessinée</text><rect x="588" y="241" width="24" height="28" rx="4" fill="#3a2a1c" opacity="0.85"/><text x="624" y="260" text-anchor="start" font-family="Inter" font-weight="600" font-size="15" fill="#3a2a1c">2. vérifie : au moins 1 page vierge ?</text><line x1="600" y1="305" x2="206" y2="305" stroke="#8e2f2a" stroke-width="2.2" marker-end="url(#arrw)"/><text x="400.0" y="295" text-anchor="middle" font-family="Inter" font-weight="600" font-size="15" fill="#8e2f2a">3. retire 1 page vierge du carnet de A</text><rect x="588" y="341" width="24" height="28" rx="4" fill="#3a2a1c" opacity="0.85"/><text x="624" y="360" text-anchor="start" font-family="Inter" font-weight="600" font-size="15" fill="#3a2a1c">4. crée la feuille volante (traits figés, auteur, date)</text><line x1="200" y1="405" x2="594" y2="405" stroke="#2f5d62" stroke-width="2.2" marker-end="url(#arrt)"/><text x="400.0" y="395" text-anchor="middle" font-family="Inter" font-weight="600" font-size="15" fill="#2f5d62">5. choisit le destinataire</text><line x1="600" y1="455" x2="994" y2="455" stroke="#7a5c3e" stroke-width="2.2" marker-end="url(#arr)"/><text x="800.0" y="445" text-anchor="middle" font-family="Inter" font-weight="600" font-size="15" fill="#7a5c3e">6. transfère la feuille dans l'inventaire de B</text><rect x="988" y="491" width="24" height="28" rx="4" fill="#7a5c3e" opacity="0.85"/><text x="976" y="510" text-anchor="end" font-family="Inter" font-weight="600" font-size="15" fill="#7a5c3e">7. garde volante, ou glisse dans un carnet</text>
</svg>