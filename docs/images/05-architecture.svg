<text x="600.0" y="52" text-anchor="middle" font-family="Lora" font-weight="700" font-size="26" fill="#3a2a1c">Architecture du module</text><text x="600.0" y="80" text-anchor="middle" font-family="Inter" font-weight="400" font-size="15" fill="#8a7560" font-style="italic">Trois couches, un adaptateur système, une intégration optionnelle</text><rect x="40" y="110" width="1120" height="170" rx="12" fill="none" stroke="#2f5d62" stroke-width="1.5" stroke-dasharray="6 5"/><text x="60" y="138" font-family="Lora" font-weight="700" font-size="18" fill="#2f5d62">Interface (ApplicationV2)</text><rect x="70" y="150" width="320" height="110" rx="10" fill="#fffaf0" stroke="#2f5d62" stroke-width="2"/><rect x="70" y="150" width="320" height="6" rx="3" fill="#2f5d62"/><text x="230.0" y="184" text-anchor="middle" font-family="Lora" font-weight="700" font-size="18" fill="#3a2a1c">Atelier du carnet</text><text x="230.0" y="212" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">liste des pages, feuilles</text><text x="230.0" y="236" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">navigation, copier, vendre</text><rect x="440" y="150" width="320" height="110" rx="10" fill="#fffaf0" stroke="#2f5d62" stroke-width="2"/><rect x="440" y="150" width="320" height="6" rx="3" fill="#2f5d62"/><text x="600.0" y="184" text-anchor="middle" font-family="Lora" font-weight="700" font-size="18" fill="#3a2a1c">Table à dessin</text><text x="600.0" y="212" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">canvas vectoriel : trait,</text><text x="600.0" y="236" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">gomme, texte, tampons</text><rect x="810" y="150" width="320" height="110" rx="10" fill="#fffaf0" stroke="#2f5d62" stroke-width="2"/><rect x="810" y="150" width="320" height="6" rx="3" fill="#2f5d62"/><text x="970.0" y="184" text-anchor="middle" font-family="Lora" font-weight="700" font-size="18" fill="#3a2a1c">Fenêtre de vente</text><text x="970.0" y="212" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">joueur : proposition</text><text x="970.0" y="236" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">MJ : estimation du prix</text><rect x="40" y="305" width="1120" height="170" rx="12" fill="none" stroke="#3a2a1c" stroke-width="1.5" stroke-dasharray="6 5"/><text x="60" y="333" font-family="Lora" font-weight="700" font-size="18" fill="#3a2a1c">Services</text><rect x="70" y="345" width="240" height="110" rx="10" fill="#fffaf0" stroke="#3a2a1c" stroke-width="2"/><rect x="70" y="345" width="240" height="6" rx="3" fill="#3a2a1c"/><text x="190.0" y="379" text-anchor="middle" font-family="Lora" font-weight="700" font-size="18" fill="#3a2a1c">Carnets</text><text x="190.0" y="407" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">pages, capacité,</text><text x="190.0" y="431" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">feuilles glissées</text><rect x="340" y="345" width="240" height="110" rx="10" fill="#fffaf0" stroke="#3a2a1c" stroke-width="2"/><rect x="340" y="345" width="240" height="6" rx="3" fill="#3a2a1c"/><text x="460.0" y="379" text-anchor="middle" font-family="Lora" font-weight="700" font-size="18" fill="#3a2a1c">Copie</text><text x="460.0" y="407" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">arrachage, feuille</text><text x="460.0" y="431" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">volante, transfert</text><rect x="610" y="345" width="240" height="110" rx="10" fill="#fffaf0" stroke="#3a2a1c" stroke-width="2"/><rect x="610" y="345" width="240" height="6" rx="3" fill="#3a2a1c"/><text x="730.0" y="379" text-anchor="middle" font-family="Lora" font-weight="700" font-size="18" fill="#3a2a1c">Vente</text><text x="730.0" y="407" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">négociation par</text><text x="730.0" y="431" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">socket, cartographe</text><rect x="880" y="345" width="250" height="110" rx="10" fill="#fffaf0" stroke="#3a2a1c" stroke-width="2"/><rect x="880" y="345" width="250" height="6" rx="3" fill="#3a2a1c"/><text x="1005.0" y="379" text-anchor="middle" font-family="Lora" font-weight="700" font-size="18" fill="#3a2a1c">Socket</text><text x="1005.0" y="407" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">actions du joueur</text><text x="1005.0" y="431" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">exécutées par le MJ</text><rect x="40" y="500" width="1120" height="170" rx="12" fill="none" stroke="#7a5c3e" stroke-width="1.5" stroke-dasharray="6 5"/><text x="60" y="528" font-family="Lora" font-weight="700" font-size="18" fill="#7a5c3e">Données et intégrations</text><rect x="70" y="540" width="340" height="110" rx="10" fill="#fffaf0" stroke="#7a5c3e" stroke-width="2"/><rect x="70" y="540" width="340" height="6" rx="3" fill="#7a5c3e"/><text x="240.0" y="574" text-anchor="middle" font-family="Lora" font-weight="700" font-size="18" fill="#3a2a1c">Adaptateur dnd5e</text><text x="240.0" y="602" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">type d'objet « loot »,</text><text x="240.0" y="626" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">poids, prix, inventaire</text><rect x="440" y="540" width="320" height="110" rx="10" fill="#fffaf0" stroke="#7a5c3e" stroke-width="2"/><rect x="440" y="540" width="320" height="6" rx="3" fill="#7a5c3e"/><text x="600.0" y="574" text-anchor="middle" font-family="Lora" font-weight="700" font-size="18" fill="#3a2a1c">Flags portolan.*</text><text x="600.0" y="602" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">traits vectoriels compressés</text><text x="600.0" y="626" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">dans l'objet lui-même</text><rect x="790" y="540" width="340" height="110" rx="10" fill="#fffaf0" stroke="#8e2f2a" stroke-width="2"/><rect x="790" y="540" width="340" height="6" rx="3" fill="#8e2f2a"/><text x="960.0" y="574" text-anchor="middle" font-family="Lora" font-weight="700" font-size="18" fill="#3a2a1c">Mint (optionnel)</text><text x="960.0" y="602" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">paiement si actif,</text><text x="960.0" y="626" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">sinon montant manuel</text>
