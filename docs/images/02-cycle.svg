<rect width="1200" height="560" fill="#f7efdf"/>
<rect x="8" y="8" width="1184" height="544" fill="none" stroke="#c9b28c" stroke-width="1.5" rx="6"/>
<text x="600.0" y="52" text-anchor="middle" font-family="Lora" font-weight="700" font-size="26" fill="#3a2a1c">Le cycle de vie d'une carte</text><text x="600.0" y="80" text-anchor="middle" font-family="Inter" font-weight="400" font-size="15" fill="#8a7560" font-style="italic">De la première ligne à la revente chez le cartographe</text><rect x="40" y="150" width="210" height="110" rx="10" fill="#fffaf0" stroke="#2f5d62" stroke-width="2"/><rect x="40" y="150" width="210" height="6" rx="3" fill="#2f5d62"/><text x="145.0" y="184" text-anchor="middle" font-family="Lora" font-weight="700" font-size="20" fill="#3a2a1c">Dessiner</text><text x="145.0" y="212" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">sur une page</text><text x="145.0" y="236" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">du carnet</text><rect x="330" y="150" width="210" height="110" rx="10" fill="#fffaf0" stroke="#8e2f2a" stroke-width="2"/><rect x="330" y="150" width="210" height="6" rx="3" fill="#8e2f2a"/><text x="435.0" y="184" text-anchor="middle" font-family="Lora" font-weight="700" font-size="20" fill="#3a2a1c">Copier</text><text x="435.0" y="212" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">arrache une page</text><text x="435.0" y="236" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">vierge du copiste</text><rect x="620" y="150" width="230" height="110" rx="10" fill="#fffaf0" stroke="#8e2f2a" stroke-width="2"/><rect x="620" y="150" width="230" height="6" rx="3" fill="#8e2f2a"/><text x="735.0" y="184" text-anchor="middle" font-family="Lora" font-weight="700" font-size="20" fill="#3a2a1c">Feuille volante</text><text x="735.0" y="212" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">copie figée,</text><text x="735.0" y="236" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">auteur signé</text><rect x="930" y="150" width="230" height="110" rx="10" fill="#fffaf0" stroke="#7a5c3e" stroke-width="2"/><rect x="930" y="150" width="230" height="6" rx="3" fill="#7a5c3e"/><text x="1045.0" y="184" text-anchor="middle" font-family="Lora" font-weight="700" font-size="20" fill="#3a2a1c">Donner</text><text x="1045.0" y="212" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">à un autre</text><text x="1045.0" y="236" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">joueur</text><line x1="250" y1="205" x2="328" y2="205" stroke="#2f5d62" stroke-width="2.2" marker-end="url(#arrt)"/><line x1="540" y1="205" x2="618" y2="205" stroke="#8e2f2a" stroke-width="2.2" marker-end="url(#arrw)"/><line x1="850" y1="205" x2="928" y2="205" stroke="#7a5c3e" stroke-width="2.2" marker-end="url(#arr)"/><rect x="40" y="370" width="260" height="120" rx="10" fill="#fffaf0" stroke="#3a2a1c" stroke-width="2"/><rect x="40" y="370" width="260" height="6" rx="3" fill="#3a2a1c"/><text x="170.0" y="404" text-anchor="middle" font-family="Lora" font-weight="700" font-size="20" fill="#3a2a1c">Vendre</text><text x="170.0" y="432" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">original (perd la page)</text><text x="170.0" y="456" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">ou copie (page arrachée)</text><rect x="390" y="370" width="260" height="120" rx="10" fill="#fffaf0" stroke="#3a2a1c" stroke-width="2"/><rect x="390" y="370" width="260" height="6" rx="3" fill="#3a2a1c"/><text x="520.0" y="404" text-anchor="middle" font-family="Lora" font-weight="700" font-size="20" fill="#3a2a1c">Estimation MJ</text><text x="520.0" y="432" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">voit la carte, fixe le prix</text><text x="520.0" y="456" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">Mint paie (optionnel)</text><rect x="740" y="370" width="260" height="120" rx="10" fill="#fffaf0" stroke="#3a2a1c" stroke-width="2"/><rect x="740" y="370" width="260" height="6" rx="3" fill="#3a2a1c"/><text x="870.0" y="404" text-anchor="middle" font-family="Lora" font-weight="700" font-size="20" fill="#3a2a1c">Cartographe</text><text x="870.0" y="432" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">PNJ qui garde la carte</text><text x="870.0" y="456" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">et en revend des copies</text><line x1="145" y1="260" x2="160" y2="368" stroke="#3a2a1c" stroke-width="2.2" marker-end="url(#arr)"/><text x="110" y="330" text-anchor="middle" font-family="Inter" font-style="italic" font-size="15" fill="#3a2a1c">vente</text><line x1="300" y1="430" x2="388" y2="430" stroke="#3a2a1c" stroke-width="2.2" marker-end="url(#arr)"/><line x1="650" y1="430" x2="738" y2="430" stroke="#3a2a1c" stroke-width="2.2" marker-end="url(#arr)"/><path d="M 1000 430 C 1110 430, 1110 340, 1045 262" fill="none" stroke="#8e2f2a" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrw)"/><text x="1100" y="330" text-anchor="start" font-family="Inter" font-weight="400" font-size="15" fill="#8e2f2a" font-style="italic">revente</text><text x="1100" y="350" text-anchor="start" font-family="Inter" font-weight="400" font-size="15" fill="#8e2f2a" font-style="italic">de copies</text>
</svg>