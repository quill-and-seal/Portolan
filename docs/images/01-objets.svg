<rect width="1200" height="640" fill="#f7efdf"/>
<rect x="8" y="8" width="1184" height="624" fill="none" stroke="#c9b28c" stroke-width="1.5" rx="6"/>
<text x="600.0" y="52" text-anchor="middle" font-family="Lora" font-weight="700" font-size="26" fill="#3a2a1c">Les objets de Portolan</text><text x="600.0" y="80" text-anchor="middle" font-family="Inter" font-weight="400" font-size="15" fill="#8a7560" font-style="italic">Tout vit dans l'inventaire dnd5e du personnage</text><rect x="470" y="115" width="260" height="90" rx="10" fill="#fffaf0" stroke="#3a2a1c" stroke-width="2"/><rect x="470" y="115" width="260" height="6" rx="3" fill="#3a2a1c"/><text x="600.0" y="149" text-anchor="middle" font-family="Lora" font-weight="700" font-size="20" fill="#3a2a1c">Personnage</text><text x="600.0" y="177" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">acteur dnd5e du joueur</text><rect x="60" y="290" width="330" height="210" rx="10" fill="#fffaf0" stroke="#2f5d62" stroke-width="2"/><rect x="60" y="290" width="330" height="6" rx="3" fill="#2f5d62"/><text x="225.0" y="324" text-anchor="middle" font-family="Lora" font-weight="700" font-size="20" fill="#3a2a1c">Carnet</text><text x="225.0" y="352" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">style (apparence + tampons)</text><text x="225.0" y="376" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">capacité : 25 pages (défaut)</text><text x="225.0" y="400" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">pages dessinées / vierges</text><text x="225.0" y="424" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">feuilles glissées dedans</text><text x="225.0" y="448" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">poids natif dnd5e</text><rect x="435" y="290" width="330" height="165" rx="10" fill="#fffaf0" stroke="#8e2f2a" stroke-width="2"/><rect x="435" y="290" width="330" height="6" rx="3" fill="#8e2f2a"/><text x="600.0" y="324" text-anchor="middle" font-family="Lora" font-weight="700" font-size="20" fill="#3a2a1c">Feuille volante</text><text x="600.0" y="352" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">une copie figée d'une carte</text><text x="600.0" y="376" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">auteur + date de copie</text><text x="600.0" y="400" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">ne compte pas comme une page</text><rect x="810" y="290" width="330" height="165" rx="10" fill="#fffaf0" stroke="#7a5c3e" stroke-width="2"/><rect x="810" y="290" width="330" height="6" rx="3" fill="#7a5c3e"/><text x="975.0" y="324" text-anchor="middle" font-family="Lora" font-weight="700" font-size="20" fill="#3a2a1c">Pages vierges</text><text x="975.0" y="352" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">achetées à la papeterie</text><text x="975.0" y="376" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">ajoutées à un carnet,</text><text x="975.0" y="400" text-anchor="middle" font-family="Inter" font-size="15" fill="#8a7560">dans la limite de sa capacité</text><line x1="530" y1="205" x2="260" y2="288" stroke="#2f5d62" stroke-width="2.2" marker-end="url(#arrt)"/><text x="360" y="238" text-anchor="middle" font-family="Inter" font-style="italic" font-size="15" fill="#2f5d62">possède 1..n</text><line x1="600" y1="205" x2="600" y2="288" stroke="#8e2f2a" stroke-width="2.2" marker-end="url(#arrw)"/><text x="660" y="255" text-anchor="middle" font-family="Inter" font-style="italic" font-size="15" fill="#8e2f2a">possède 0..n</text><line x1="670" y1="205" x2="940" y2="288" stroke="#7a5c3e" stroke-width="2.2" marker-end="url(#arr)"/><text x="850" y="238" text-anchor="middle" font-family="Inter" font-style="italic" font-size="15" fill="#7a5c3e">possède 0..n</text><path d="M 600 455 C 600 545, 330 560, 300 505" fill="none" stroke="#8e2f2a" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrw)"/><text x="615" y="492" text-anchor="start" font-family="Inter" font-weight="400" font-size="15" fill="#8e2f2a" font-style="italic">glissée dans un carnet,</text><text x="615" y="512" text-anchor="start" font-family="Inter" font-weight="400" font-size="15" fill="#8e2f2a" font-style="italic">sans prendre de page</text><path d="M 975 455 C 975 640, 250 640, 225 505" fill="none" stroke="#7a5c3e" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arr)"/><text x="990" y="492" text-anchor="start" font-family="Inter" font-weight="400" font-size="15" fill="#7a5c3e" font-style="italic">consommées pour</text><text x="990" y="512" text-anchor="start" font-family="Inter" font-weight="400" font-size="15" fill="#7a5c3e" font-style="italic">agrandir un carnet</text>
</svg>