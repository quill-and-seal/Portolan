<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7a5c3e"/></marker>
  <marker id="arrw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8e2f2a"/></marker>
  <marker id="arrt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2f5d62"/></marker>
</defs>
<rect width="1200" height="680" fill="#f7efdf"/>
<rect x="8" y="8" width="1184" height="664" fill="none" stroke="#c9b28c" stroke-width="1.5" rx="6"/>
<text x="600.0" y="52" text-anchor="middle" font-family="Lora" font-weight="700" font-size="26" fill="#3a2a1c">Vendre une carte au cartographe</text><text x="600.0" y="80" text-anchor="middle" font-family="Inter" font-weight="400" font-size="15" fill="#8a7560" font-style="italic">Le MJ ne voit la carte qu'ici, en lecture seule</text><rect x="50" y="110" width="240" height="54" rx="10" fill="#fffaf0" stroke="#2f5d62" stroke-width="2"/><text x="170" y="144" text-anchor="middle" font-family="Lora" font-weight="700" font-size="18" fill="#3a2a1c">Joueur</text><line x1="170" y1="164" x2="170" y2="640" stroke="#c9b28c" stroke-width="2" stroke-dasharray="4 6"/><rect x="350" y="110" width="240" height="54" rx="10" fill="#fffaf0" stroke="#3a2a1c" stroke-width="2"/><text x="470" y="144" text-anchor="middle" font-family="Lora" font-weight="700" font-size="18" fill="#3a2a1c">Portolan (socket)</text><line x1="470" y1="164" x2="470" y2="640" stroke="#c9b28c" stroke-width="2" stroke-dasharray="4 6"/><rect x="650" y="110" width="240" height="54" rx="10" fill="#fffaf0" stroke="#8e2f2a" stroke-width="2"/><text x="770" y="144" text-anchor="middle" font-family="Lora" font-weight="700" font-size="18" fill="#3a2a1c">MJ</text><line x1="770" y1="164" x2="770" y2="640" stroke="#c9b28c" stroke-width="2" stroke-dasharray="4 6"/><rect x="920" y="110" width="240" height="54" rx="10" fill="#fffaf0" stroke="#7a5c3e" stroke-width="2"/><text x="1040" y="144" text-anchor="middle" font-family="Lora" font-weight="700" font-size="18" fill="#3a2a1c">Mint (optionnel)</text><line x1="1040" y1="164" x2="1040" y2="640" stroke="#c9b28c" stroke-width="2" stroke-dasharray="4 6"/><line x1="170" y1="205" x2="464" y2="205" stroke="#2f5d62" stroke-width="2.2" marker-end="url(#arrt)"/><text x="320.0" y="195" text-anchor="middle" font-family="Inter" font-weight="600" font-size="15" fill="#2f5d62">1. propose : original ou copie</text><line x1="470" y1="255" x2="764" y2="255" stroke="#3a2a1c" stroke-width="2.2" marker-end="url(#arr)"/><text x="620.0" y="245" text-anchor="middle" font-family="Inter" font-weight="600" font-size="15" fill="#3a2a1c">2. demande d'estimation (aperçu figé)</text><rect x="758" y="291" width="24" height="28" rx="4" fill="#8e2f2a" opacity="0.85"/><text x="794" y="310" text-anchor="start" font-family="Inter" font-weight="600" font-size="15" fill="#8e2f2a">3. compare à la vraie carte</text><line x1="770" y1="355" x2="476" y2="355" stroke="#8e2f2a" stroke-width="2.2" marker-end="url(#arrw)"/><text x="620.0" y="345" text-anchor="middle" font-family="Inter" font-weight="600" font-size="15" fill="#8e2f2a">4. propose un prix</text><line x1="470" y1="405" x2="176" y2="405" stroke="#3a2a1c" stroke-width="2.2" marker-end="url(#arr)"/><text x="320.0" y="395" text-anchor="middle" font-family="Inter" font-weight="600" font-size="15" fill="#3a2a1c">5. affiche l'offre</text><line x1="170" y1="455" x2="464" y2="455" stroke="#2f5d62" stroke-width="2.2" marker-end="url(#arrt)"/><text x="320.0" y="445" text-anchor="middle" font-family="Inter" font-weight="600" font-size="15" fill="#2f5d62">6. accepte ou refuse</text><line x1="470" y1="505" x2="1034" y2="505" stroke="#7a5c3e" stroke-width="2.2" marker-end="url(#arr)"/><text x="755.0" y="495" text-anchor="middle" font-family="Inter" font-weight="600" font-size="15" fill="#7a5c3e">7. paiement au joueur</text><rect x="458" y="541" width="24" height="28" rx="4" fill="#3a2a1c" opacity="0.85"/><text x="494" y="560" text-anchor="start" font-family="Inter" font-weight="600" font-size="15" fill="#3a2a1c">8. original : page retirée / copie : page vierge arrachée</text><rect x="458" y="591" width="24" height="28" rx="4" fill="#3a2a1c" opacity="0.85"/><text x="494" y="610" text-anchor="start" font-family="Inter" font-weight="600" font-size="15" fill="#3a2a1c">9. la carte rejoint l'inventaire du cartographe</text>
</svg>